<title>CRM Keshion IA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: celular primeiro. Coluna única com barra de navegação flutuante escura embaixo; a partir de 900px vira barra lateral + conteúdo em grade. Fichas e conversas sobem de baixo. */
:root{
  --page:#efece4;--blob1:#dfe6cf;--blob2:#efdcc6;
  --surface:#fbfaf6;--card:#ffffff;--soft:#f3f1ea;--ink:#1d2416;--ink2:#5c6455;--line:#e7e3d8;
  --accent:#3f5a2a;--accent-ink:#ffffff;--accent-soft:#e6ecd9;--hero:#2c3a1f;--hero-ink:#f4f6ee;--nav:#1f2618;
  --late:#c2462a;--late-soft:#fbe6df;--warn:#9a6a00;--warn-soft:#f8eed3;--good:#2f7a4b;--good-soft:#dff0e5;--info:#2d5f86;--info-soft:#e0ecf5;
  --shadow:0 1px 2px rgba(30,35,20,.05),0 8px 24px rgba(30,35,20,.06);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;--r:22px;
}
:root[data-pal="menta"]{--page:#e8f2ef;--blob1:#cfece4;--blob2:#dfe9f6;--accent:#0f7a6a;--accent-soft:#d9f1ec;--hero:#0d4d45;--hero-ink:#effaf7;--nav:#0f2a27}
:root[data-pal="lavanda"]{--page:#ece9f7;--blob1:#f6d9ea;--blob2:#d9def8;--accent:#5b45d6;--accent-soft:#e7e3fb;--hero:#2a2160;--hero-ink:#f3f1ff;--nav:#17142e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#121410;--blob1:#1d2418;--blob2:#241e17;--surface:#171a14;--card:#1f231b;--soft:#272b22;--ink:#eef0e8;--ink2:#a9b0a0;--line:#30352b;--accent:#a9c98a;--accent-ink:#17200f;--accent-soft:#2b3522;--hero:#2b3820;--hero-ink:#f1f5ea;--nav:#0b0d09;--late:#f0937a;--late-soft:#3d2219;--warn:#e7bd55;--warn-soft:#3a2f12;--good:#7fcf9c;--good-soft:#1b3324;--info:#8dbde6;--info-soft:#1a2c3c;--shadow:none;color-scheme:dark}
 :root[data-pal="menta"]:not([data-theme="light"]){--accent:#6fd3c1;--accent-soft:#163a35;--hero:#123c36}
 :root[data-pal="lavanda"]:not([data-theme="light"]){--accent:#b3a6ff;--accent-soft:#2a2550;--hero:#2a2458}}
:root[data-theme="dark"]{--page:#121410;--blob1:#1d2418;--blob2:#241e17;--surface:#171a14;--card:#1f231b;--soft:#272b22;--ink:#eef0e8;--ink2:#a9b0a0;--line:#30352b;--accent:#a9c98a;--accent-ink:#17200f;--accent-soft:#2b3522;--hero:#2b3820;--hero-ink:#f1f5ea;--nav:#0b0d09;--late:#f0937a;--late-soft:#3d2219;--warn:#e7bd55;--warn-soft:#3a2f12;--good:#7fcf9c;--good-soft:#1b3324;--info:#8dbde6;--info-soft:#1a2c3c;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--page);background-image:radial-gradient(60% 40% at 10% 0%,var(--blob1),transparent 70%),radial-gradient(50% 40% at 100% 20%,var(--blob2),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:15;background:var(--page)}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:12px}
.shell{max-width:1180px;margin:0 auto;display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding-block:16px calc(110px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:560px;margin:0 auto;width:100%}
.top{display:flex;align-items:center;gap:12px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;background:var(--accent-soft);color:var(--accent)}
.avatar.sm{width:40px;height:40px;font-size:14px}.avatar.lg{width:64px;height:64px;font-size:22px}
.hello{flex:1;min-width:0}.hello small{color:var(--ink2);font-size:13px;display:block}.hello b{font-size:16px}
.iconbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;position:relative;box-shadow:var(--shadow)}
.dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--late);border:2px solid var(--card)}
h1{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--ink2);margin:4px 0 0;font-size:15px}
.pills{display:flex;gap:8px;overflow-x:auto;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.pill{border:0;background:var(--card);color:var(--ink);border-radius:999px;padding:0 16px;min-height:42px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
.pill i{font-style:normal;background:var(--soft);border-radius:999px;padding:0 7px;font-size:12px;min-width:22px;text-align:center}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.pill[aria-pressed="true"] i{background:rgba(255,255,255,.18);color:inherit}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:24px solid rgba(255,255,255,.06)}
.hero .big{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em}
.hero p{margin:0;opacity:.85;font-size:15px}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.chipline{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 2px -6px}
.sec h2{font-size:19px;font-weight:700;margin:0}.sec span{color:var(--ink2);font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;min-width:0}

.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.t-late{background:var(--late-soft);color:var(--late)}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-good{background:var(--good-soft);color:var(--good)}.t-info{background:var(--info-soft);color:var(--info)}.t-neutral{background:var(--soft);color:var(--ink2)}.t-acc{background:var(--accent-soft);color:var(--accent)}
.quote{background:var(--soft);border-radius:16px;padding:12px 14px;font-size:15px;margin:0}
.quote em{display:block;font-style:normal;font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:2px}
.acts{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:999px;min-height:48px;padding:0 18px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform .12s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.dark{background:var(--ink);color:var(--surface);flex:1}
.btn.acc{background:var(--accent);color:var(--accent-ink);flex:1}
.btn.soft{background:var(--soft);color:var(--ink);flex:1}
.btn.round{width:48px;padding:0;flex:none;background:var(--soft);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.agenda{display:flex;flex-direction:column}
.slot{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.slot:last-child{border-bottom:0}
.time{background:var(--ink);color:var(--surface);border-radius:14px;padding:8px 10px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
.slot .nm{flex:1;min-width:0}.slot b{display:block;font-size:15px}.slot small{color:var(--ink2);font-size:13px}
.ia{display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.ia .n{font-size:30px;font-weight:800;color:var(--accent);line-height:1}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:50px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:none;color:var(--ink);font:16px var(--font);min-width:0;outline:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:999px;min-height:40px;font-weight:600;font-size:14px;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--soft);border-radius:18px;padding:12px 14px;min-width:0}
.tile span{display:block;color:var(--ink2);font-size:12px;font-weight:600}.tile b{font-size:16px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.conv{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;background:none;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;color:inherit}
.conv:last-child{border-bottom:0}
.conv .nm{flex:1;min-width:0}.conv b{font-size:15px}.conv p{margin:2px 0 0;color:var(--ink2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv time{font-size:12px;color:var(--ink2);white-space:nowrap}
.list{padding:0;gap:0;overflow:hidden}
nav.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 24px),520px);background:var(--nav);border-radius:999px;padding:7px;display:flex;justify-content:space-between;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.dk{border:0;background:none;color:rgba(255,255,255,.72);border-radius:999px;min-height:50px;min-width:50px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;cursor:pointer;font-weight:700;font-size:14px;position:relative}
.dk span{display:none}
.dk[aria-current="page"]{background:#fff;color:#141810}
.dk[aria-current="page"] span{display:inline}
.dk .cnt{position:absolute;top:6px;right:6px;background:var(--late);color:#fff;font-size:10px;font-weight:800;border-radius:99px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.scrim{position:fixed;inset:0;background:rgba(10,12,8,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding-block:10px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
.lbl{font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 8px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:0 14px;min-height:42px;font-weight:600;font-size:14px;cursor:pointer}
.choice[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tl{display:flex;flex-direction:column;gap:14px;border-left:2px solid var(--line);margin-left:8px;padding-left:16px;font-size:15px}
.tl em{display:block;font-style:normal;color:var(--ink2);font-size:12px;font-weight:600}
.chat{display:flex;flex-direction:column;gap:8px;background:var(--soft);border-radius:20px;padding:14px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;font-size:15px}
.msg.p{background:var(--card);align-self:flex-start;border-bottom-left-radius:6px}
.msg.a{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:6px}
.msg.e{background:var(--ink);color:var(--surface);align-self:flex-end;border-bottom-right-radius:6px}
.msg small{display:block;font-size:11px;opacity:.75;font-weight:700;margin-bottom:2px}
textarea,.inp{width:100%;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);font:16px var(--font);padding:12px 14px;min-height:50px}
textarea{min-height:110px;resize:vertical}
.err{color:var(--late);font-size:13px;font-weight:600}
.check{display:flex;align-items:center;gap:12px;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--accent);flex:none}
.kpi{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi span{color:var(--ink2);font-size:13px;font-weight:600}.kpi b{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.kpi small{font-size:12px;color:var(--ink2)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.how{border:0;background:none;color:var(--accent);font-weight:700;font-size:12px;padding:0;cursor:pointer;text-align:left;min-height:28px}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px}
.bars i{flex:1;border-radius:6px 6px 3px 3px;background:var(--accent);min-height:4px}
.bars i.off{background:var(--late)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);font-weight:600}.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cmp{display:flex;align-items:center;gap:14px}.cmp div{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);border-radius:18px;padding:8px 8px 8px 18px;min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px;width:min(92%,480px);z-index:40;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast button{background:none;border:0;color:inherit;font-weight:800;text-decoration:underline;min-height:44px;padding:0 12px;cursor:pointer}
.note{color:var(--ink2);font-size:14px;margin:0}
.empty{text-align:center;padding:26px 10px}.empty b{display:block;font-size:18px}.empty p{color:var(--ink2);margin:4px 0 0}
.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw{border:2px solid var(--line);border-radius:18px;padding:10px;background:var(--card);cursor:pointer;color:var(--ink);font-weight:700;font-size:13px;display:flex;flex-direction:column;gap:8px;align-items:center}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.sw i{display:flex;gap:4px}.sw i b{width:18px;height:18px;border-radius:50%}
@media (min-width:900px){
  .shell{gap:24px;padding:24px}
  .side{display:flex;flex-direction:column;gap:6px;width:240px;flex:none;background:var(--card);border-radius:28px;padding:22px 14px;box-shadow:var(--shadow);border:1px solid var(--line);position:sticky;top:24px;height:calc(100vh - 48px)}
  .brand{font-weight:800;font-size:19px;padding:0 10px 18px;display:flex;align-items:center;gap:10px}
  .brand i{width:30px;height:30px;border-radius:10px;background:var(--accent);display:block}
  .sd{border:0;background:none;color:var(--ink2);border-radius:16px;min-height:48px;display:flex;align-items:center;gap:12px;padding:0 14px;font-weight:600;font-size:15px;cursor:pointer;position:relative}
  .sd[aria-current="page"]{background:var(--ink);color:var(--surface)}
  .sd .cnt{margin-left:auto;background:var(--late);color:#fff;font-size:11px;font-weight:800;border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
  .main{max-width:none;margin:0;padding:0 0 24px}
  nav.dock{display:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .scrim{align-items:center}.sheet{border-radius:28px;max-height:86vh}
  .toast{bottom:24px}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .25s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}}
</style>

 <label class="lbl" for="tx">Próxima sessão</label><input class="inp" id="tx" value="${esc(t.prox)}" placeholder="12/11 às 9h">
 <span class="err" id="terr" aria-live="polite"></span>
 <div class="acts"><button class="btn dark" data-act="salvatrat" data-pid="${pid}">Salvar</button><button class="btn soft" data-close>Cancelar</button></div>`)}

/* RETORNOS */
function retornos(){const nomeR=r=>r.nome||P(r.id).nome;const sel=S.ret.filter(r=>r.sel);const n=sel.length;
 return header("Retornos","Pacientes antigos no tempo da revisão, da manutenção ou do retorno.")+
 `<div class="grid2"><div class="stack"><div class="sec"><h2>${n} de ${S.ret.length} selecionados</h2><button class="how" data-act="todos">${n===S.ret.length?"Limpar":"Selecionar todos"}</button></div>
 <div class="card list">${S.ret.map(r=>`<label class="conv check"><input type="checkbox" data-sel="${r.id}" ${r.sel?"checked":""}>${av({id:r.id,nome:nomeR(r)},"sm")}<span class="nm"><b>${esc(nomeR(r))}</b><p>${esc(r.motivo)} · última visita ${r.ult}</p></span></label>`).join("")}</div></div>
 <div class="stack"><div class="sec"><h2>Mensagem</h2><span>assinada pela equipe</span></div>
 <div class="card"><div class="chat"><div class="msg e"><small>Erica · Clínica Dra. Suzana</small>Olá, ${esc(first(sel[0]?nomeR(sel[0]):"Sônia"))}, tudo bem? Aqui é a Erica, da clínica da Dra. Suzana. Vi que já faz um tempo da sua última visita e queria saber se você quer marcar sua revisão. Quer que eu veja os horários livres da doutora?</div><div class="msg p"><small>Paciente</small>Quero sim</div><div class="msg a"><small>IA</small>Tenho quinta às 9h ou sexta às 14h. Qual fica melhor?</div></div>
 <p class="note">Rascunho de tom. O texto final ajustamos com as respostas da clínica. Se a pessoa disser que sim, a IA oferece os horários e marca.</p>
 <button class="btn dark" data-act="lote" ${n?"":"disabled"}>${n?`Aprovar envio para ${n}`:"Selecione ao menos um paciente"}</button><p class="note" style="font-size:12px">Saem em lotes pequenos ao longo do dia. Quem responder SAIR não recebe mais.</p></div></div></div>`;
}

/* RESULTADOS */
function resultados(){
 const k=(l,v,s)=>`<div class="kpi"><span>${l}</span><b>${v}</b><small>${s}</small></div>`;
 const hrs=[3,6,9,12,10,8,9,11,10,9,8,12,15,17,14,9,4],lab=["7h","","9h","","11h","","13h","","15h","","17h","","19h","","21h","","23h"];
 return header("Resultados","Cada número diz de onde vem.")+
 `<div class="pills" role="group" aria-label="Período">${["Semana","Mês","3 meses"].map(x=>`<button class="pill" data-per="${x}" aria-pressed="${periodo===x}">${x}</button>`).join("")}</div>
 <section class="hero"><p>Valor fechado depois de um lembrete da IA</p><div class="big">R$ 48 mil</div><div class="row"><span class="chipline">4 tratamentos</span><span class="chipline">16× o valor da mensalidade</span></div><button class="how" style="color:var(--hero-ink);text-decoration:underline" data-act="how" data-h="recuperado">Como calculamos</button></section>
 <div class="sec"><h2>Medido pelo sistema</h2><span>automático</span></div>
 <div class="kpis">${k("Mensagens respondidas","412","38% fora do horário")+k("Primeira resposta","1 min","média do período")+k("Avaliações marcadas pela IA","31","de 184 contatos novos")+k("Remarcações pela IA","9","horários reaproveitados")+k("Confirmações respondidas","86%","das avaliações")+k("Lembretes de orçamento","42","11 pacientes responderam")+k("Retornos que agendaram","6","de 24 mensagens")+k("Conversas com a equipe","23","o resto a IA resolveu")}</div>
 <div class="grid2"><div class="card"><div style="display:flex;justify-content:space-between"><b>Mensagens por hora</b><div class="legend"><span><b style="background:var(--accent)"></b>Horário comercial</span><span><b style="background:var(--late)"></b>Fora</span></div></div><div class="bars" role="img" aria-label="Mensagens por hora do dia; o pico é entre 19h e 21h, fora do horário comercial">${hrs.map((v,i)=>`<i class="${i<2||i>=11?"off":""}" style="height:${v/17*100}%"></i>`).join("")}</div><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink2)">${lab.filter(Boolean).map(l=>`<span>${l}</span>`).join("")}</div></div>
 <div class="card"><b>Faltas: antes e agora</b><div class="cmp"><div><small class="note">Antes (informado pela clínica)</small><div style="font-size:28px;font-weight:800">18%</div></div><div><small class="note">Agora (marcado pela equipe)</small><div style="font-size:28px;font-weight:800;color:var(--good)">9%</div></div></div><p class="note" style="font-size:13px">Comparação com o período anterior, não uma contagem de faltas evitadas.</p></div></div>
 <div class="sec"><h2>Depende da equipe marcar</h2><span>"fechou" e "compareceu"</span></div>
 <div class="kpis">${k("Valor fechado no período","R$ 96 mil","9 tratamentos")+k("Comparecimento","91%","nas avaliações")+k("Orçamentos em aberto","R$ 186 mil","14 pacientes")+k("Não fecharam","5","2 por preço · 2 outra clínica")}</div>`;
}

/* NAV, AVISOS, ESTILO */
function avisos(){
 sheet(`<h2>Avisos para a equipe</h2><p class="note">Cada pendência gera um aviso no grupo de WhatsApp da clínica. Se ninguém resolver, o lembrete sobe de nível.</p>
 <div class="stack">${S.pend.map(x=>{const p=P(x.pid);const nivel=x.espera>=30?["Avisado à doutora","t-late"]:x.espera>=10?["Lembrete reenviado à recepção","t-warn"]:["Aviso enviado à recepção","t-info"];return `<div class="card" style="box-shadow:none"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${esc(p.nome)}</b><span class="tag ${nivel[1]}">${nivel[0]}</span></div><small class="note">${x.tipo} · esperando há ${x.espera} min</small></div>`}).join("")}</div>
 <div class="chat"><div class="msg p"><small>Keshion IA · grupo Equipe Dra. Suzana</small>Pendência: Paula Antunes relatou dor e inchaço depois do implante. Esperando há 8 min. Abrir: keshion.app/p/11</div></div>
 <div class="card" style="box-shadow:none"><p class="lbl">Regras deste protótipo</p><p class="note">Aviso imediato no grupo. Sem resposta em 10 min no horário comercial: lembrete para a recepção. Em 30 min: aviso direto para a doutora. Fora do horário: o paciente recebe o horário de retorno e o aviso sai na abertura da clínica. Os tempos são ajustáveis por clínica.</p></div>
 <button class="btn soft" data-close>Fechar</button>`)}
function estilo(){const cur=document.documentElement.dataset.pal||"oliva";
 const pal=[["oliva","Oliva",["#2c3a1f","#3f5a2a","#efece4"]],["menta","Menta",["#0d4d45","#0f7a6a","#e8f2ef"]],["lavanda","Lavanda",["#2a2160","#5b45d6","#ece9f7"]]];
 sheet(`<h2>Estilo visual</h2><p class="note">Três direções inspiradas nas referências. Toque para comparar.</p><div class="palette">${pal.map(p=>`<button class="sw" data-pal="${p[0]}" aria-pressed="${cur===p[0]}"><i>${p[2].map(c=>`<b style="background:${c}"></b>`).join("")}</i>${p[1]}</button>`).join("")}</div><button class="btn soft" data-close>Fechar</button>`)}
function nav(){
 const cnt=S.pend.length;
 $("#dock").innerHTML=TABS.map(t=>`<button class="dk" data-v="${t[0]}" ${t[0]===view?'aria-current="page"':""} aria-label="${t[1]}">${t[2]}<span>${t[1]}</span>${t[0]==="pendencias"&&cnt&&t[0]!==view?`<b class="cnt">${cnt}</b>`:""}</button>`).join("");
 $("#sidenav").innerHTML=TABS.map(t=>`<button class="sd" data-v="${t[0]}" ${t[0]===view?'aria-current="page"':""}>${t[2]}${t[1]}${t[0]==="pendencias"&&cnt?`<b class="cnt">${cnt}</b>`:""}</button>`).join("");
}
const V={pendencias,conversas,pacientes,retornos,resultados};
function render(){$("#main").innerHTML=V[view]();nav();
 const b=$("#busca");if(b)b.oninput=e=>{busca=e.target.value;const pos=e.target.selectionStart;render();const nb=$("#busca");nb.focus();nb.setSelectionRange(pos,pos)}}
function go(v){view=v;try{history.replaceState(null,"","#"+v)}catch(e){}render();window.scrollTo(0,0)}
function sheet(html){closeSheets();const sc=document.createElement("div");sc.className="scrim";sc.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab" aria-hidden="true"></div>${html}</div>`;
 sc.addEventListener("click",e=>{if(e.target===sc||e.target.closest("[data-close]"))sc.remove()});document.body.appendChild(sc);(sc.querySelector("button,textarea,input"))?.focus()}
function closeSheets(){document.querySelectorAll(".scrim").forEach(s=>s.remove())}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheets()});
function resolvePend(id,msg,linha){const u=snap();const x=S.pend.find(y=>y.id===id);S.pend=S.pend.filter(y=>y.id!==id);const c=S.conv.find(y=>y.pid===x.pid);if(c){c.st="IA respondeu";c.tag="t-acc"}if(linha)P(x.pid).hist.unshift(["Agora",linha]);closeSheets();render();toast(msg,u)}

document.addEventListener("click",e=>{
 const t=e.target.closest("[data-v],[data-go],[data-open],[data-chat],[data-fp],[data-fc],[data-fpac],[data-fsit],[data-dia],[data-per],[data-dec],[data-sel],[data-setsit],[data-motivo],[data-pal],[data-act]");if(!t)return;const d=t.dataset;
 if(d.v)return go(d.v);if(d.go)return go(d.go);
 if(d.open)return ficha(+d.open);if(d.chat)return chat(+d.chat);
 if(d.fp){fPend=d.fp;return render()}if(d.fc){fConv=d.fc;return render()}if(d.fpac){fPac=d.fpac;return render()}if(d.fsit!==undefined&&t.matches("[data-fsit]")){fSit=d.fsit;return render()}
 if(d.dia){dia=d.dia;return render()}if(d.per){periodo=d.per;render();return toast("No app real, os números mudam para o período escolhido")}
 if(d.dec){const x=S.pend.find(y=>y.id===+d.dec);return resolvePend(x.id,"A IA vai responder: "+d.op.toLowerCase(),"Equipe decidiu: "+d.op)}
 if(d.sel){S.ret.find(r=>r.id===+d.sel).sel=t.checked;return render()}
 if(d.setsit){const p=P(+d.pid);if(d.setsit==="Não fechou")return motivoNao(p.id);const u=snap();p.sit=d.setsit;if(["Em tratamento","Tratamento concluído"].includes(p.sit))p.ja=true;p.hist.unshift(["Agora","Situação: "+p.sit]);closeSheets();render();return toast(first(p.nome)+": "+p.sit,u)}
 if(d.motivo){const p=P(+d.pid);const u=snap();p.sit="Não fechou";p.motivo=d.motivo;p.hist.unshift(["Agora","Não fechou: "+d.motivo]);closeSheets();render();return toast(first(p.nome)+" marcado como não fechou",u)}
 if(d.pal){document.documentElement.dataset.pal=d.pal;try{localStorage.setItem("kpal",d.pal)}catch(_){}document.querySelectorAll(".sw").forEach(s=>s.setAttribute("aria-pressed",s.dataset.pal===d.pal));return}
 const pid=+d.pid,id=+d.id;
 switch(d.act){
  case "avisos":return avisos();
  case "estilo":return estilo();
  case "assumir":{S.assumidas[pid]=true;const x=S.pend.find(y=>y.id===id);S.pend=S.pend.filter(y=>y.id!==id);render();chat(pid);return toast("Você assumiu a conversa. A IA pausou para "+first(P(pid).nome))}
  case "assumirChat":S.assumidas[pid]=true;S.pend=S.pend.filter(y=>y.pid!==pid);render();return chat(pid);
  case "devolver":delete S.assumidas[pid];closeSheets();render();return toast("Conversa devolvida para a IA");
  case "enviarEq":{const v=$("#resp").value.trim();if(!v){$("#resp").focus();return toast("Escreva a mensagem antes de enviar")}P(pid).hist.unshift(["Agora","Equipe: "+v]);closeSheets();render();return toast("Mensagem enviada para "+first(P(pid).nome))}
  case "resolvido":return resolvePend(id,"Pendência resolvida","Resolvido pela equipe");
  case "ensinar":{const x=S.pend.find(y=>y.id===id);return sheet(`<h2>Responder e ensinar a IA</h2><p class="quote"><em>Pergunta</em>${esc(x.msg)}</p><label class="lbl" for="ens">Resposta</label><textarea id="ens" placeholder="Ex.: Não atendemos pelo OdontoPrev, mas oferecemos parcelamento em até 12 vezes."></textarea><span class="err" id="enserr" aria-live="polite"></span><label class="check"><input type="checkbox" id="base" checked> Guardar na base da clínica para as próximas vezes</label><div class="acts"><button class="btn dark" data-act="ensinarOk" data-id="${id}">Enviar</button><button class="btn soft" data-close>Cancelar</button></div>`)}
  case "ensinarOk":{const v=$("#ens").value.trim();if(!v){$("#enserr").textContent="Escreva a resposta antes de enviar.";return}const b=$("#base").checked;return resolvePend(id,b?"Enviado. A IA aprendeu essa resposta":"Resposta enviada","Equipe respondeu"+(b?" e a resposta entrou na base da clínica":""))}
  case "sit":return mudarSit(pid);
  case "edtrat":return edTrat(pid);
  case "salvatrat":{const v=parseInt(($("#tv").value||"").replace(/\D/g,""),10)||0,f=parseInt($("#tf").value,10)||0,tot=parseInt($("#tt").value,10)||0;if(!$("#tn").value.trim()){$("#terr").textContent="Escreva o que foi orçado.";return}if(f>tot&&tot){$("#terr").textContent="Sessões feitas não pode ser maior que o total.";return}const p=P(pid),u=snap();p.trat={nome:$("#tn").value.trim(),valor:v,pag:$("#tp").value.trim(),feitas:f,total:tot,prox:$("#tx").value.trim()};if(p.sit==="Avaliou, aguardando orçamento"||p.sit==="Em conversa"||p.sit==="Avaliação marcada")p.sit="Orçamento em aberto";p.hist.unshift(["Agora","Tratamento atualizado"]);closeSheets();render();ficha(pid);return toast("Tratamento salvo",u)}
  case "salvanota":{const p=P(pid);p.notas=$("#nota").value;return toast("Anotação salva")}
  case "novo":return sheet(`<h2>Novo paciente</h2><p class="note">Para quem ligou ou chegou pela recepção.</p><label class="lbl" for="nn">Nome</label><input class="inp" id="nn" autocomplete="off"><label class="lbl" for="nt">WhatsApp com DDD</label><input class="inp" id="nt" inputmode="tel" placeholder="(41) 99999-0000"><label class="lbl">Já é paciente da clínica?</label><div class="seg" style="grid-template-columns:1fr 1fr"><button data-act="ja" data-v2="0" aria-pressed="true">Não</button><button data-act="ja" data-v2="1" aria-pressed="false">Sim</button></div><span class="err" id="nerr" aria-live="polite"></span><div class="acts"><button class="btn dark" data-act="cad">Cadastrar</button><button class="btn soft" data-close>Cancelar</button></div>`);
  case "ja":t.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t));return;
  case "cad":{const n=$("#nn").value.trim(),tel=$("#nt").value.replace(/\D/g,"");if(n.length<2){$("#nerr").textContent="Digite o nome do paciente.";return}if(tel.length<10){$("#nerr").textContent="Digite o WhatsApp com DDD.";return}const ja=document.querySelector('[data-act="ja"][aria-pressed="true"]').dataset.v2==="1";const u=snap();S.pac.unshift({id:Date.now()%100000,nome:n,tel:$("#nt").value,sit:ja?"Tratamento concluído":"Novo contato",ja,origem:"Recepção",inicio:"11/2026",trat:null,notas:"",hist:[["Agora","Cadastrado pela recepção"]]});closeSheets();render();return toast(first(n)+" cadastrado",u)}
  case "todos":{const all=S.ret.every(r=>r.sel);S.ret.forEach(r=>r.sel=!all);return render()}
  case "lote":return toast(S.ret.filter(r=>r.sel).length+" mensagens aprovadas. Saem ao longo do dia");
  case "how":return sheet(`<h2>Como calculamos</h2><p>Soma dos tratamentos marcados como fechados pela equipe em que o paciente: fez o primeiro contato fora do horário comercial, ou fechou depois de pelo menos um lembrete de orçamento enviado pela IA, ou voltou por uma mensagem de retorno.</p><p class="note">O valor depende de a equipe marcar o tratamento como fechado na ficha do paciente.</p><button class="btn soft" data-close>Entendi</button>`);
  case "wa":return toast("No app real, abre a conversa no WhatsApp");
  case "ligar":return toast("No app real, abre a ligação");
 }
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(V[h]&&h!==view){view=h;render()}});
try{const p=localStorage.getItem("kpal");if(p)document.documentElement.dataset.pal=p}catch(_){}
render();
</script>
