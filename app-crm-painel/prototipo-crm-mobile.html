<style>
/* Marca Keshion AI (branding/guia-de-marca.md): Manrope 700 nos títulos, Inter no texto, cores oficiais.
   Celular primeiro: barra de abas fixa embaixo com rótulo sempre visível; a partir de 900px vira barra lateral.
   Visual sóbrio: fundo liso, cards com borda fina, cantos de 10 a 12px, sem sombras grandes nem degradês. */
:root{
  --night:#0B1126;--blue:#4388E8;--green:#55C96A;--ice:#F7F8F4;--navy:#17233E;--fog:#E8EFF9;--blue-strong:#2459A6;--slate:#50596A;--silver:#CCD5E6;
  --bg:var(--ice);--card:#FFFFFF;--soft:var(--fog);--ink:var(--night);--ink2:var(--slate);--line:#DEE4EE;
  --action:var(--blue-strong);--on-action:var(--ice);--action-soft:var(--fog);--focus:var(--blue-strong);
  --hero:var(--night);--hero-ink:var(--ice);--hero-ink2:var(--silver);
  --late:#B42318;--late-soft:#FDECEA;--warn:#8A5300;--warn-soft:#FBF0DA;--good:#1D6B33;--good-soft:#E2F4E6;--info:var(--blue-strong);--info-soft:var(--fog);
  --bar-a:var(--blue-strong);--bar-b:var(--slate);--c-azul:#2459A6;--c-ambar:#B7791F;--c-rosa:#C0397B;--c-verde:#2E9E4F;--c-coral:#D2503C;--c-ardosia:#50596A;--on-chip:#FFFFFF;
  --font:Inter,system-ui,-apple-system,sans-serif;--font-h:Manrope,Inter,system-ui,sans-serif;--r:12px;--rs:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:var(--night);--card:var(--navy);--soft:#1F2D4D;--ink:var(--ice);--ink2:var(--silver);--line:#26365A;
  --action:var(--blue);--on-action:var(--night);--action-soft:#1F2D4D;--focus:var(--green);
  --hero:#1F2D4D;--hero-ink:var(--ice);--hero-ink2:var(--silver);
  --late:#FF9C8F;--late-soft:#3A1E24;--warn:#F2C46B;--warn-soft:#3A2F17;--good:var(--green);--good-soft:#173826;--info:#8DB8F2;--info-soft:#1F2D4D;
  --bar-a:var(--blue);--bar-b:var(--silver);--c-azul:#4388E8;--c-ambar:#BF8A14;--c-rosa:#E0609A;--c-verde:#3BAA57;--c-coral:#E5654F;--c-ardosia:#8A94A8;--on-chip:#0B1126;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:var(--night);--card:var(--navy);--soft:#1F2D4D;--ink:var(--ice);--ink2:var(--silver);--line:#26365A;
  --action:var(--blue);--on-action:var(--night);--action-soft:#1F2D4D;--focus:var(--green);
  --hero:#1F2D4D;--hero-ink:var(--ice);--hero-ink2:var(--silver);
  --late:#FF9C8F;--late-soft:#3A1E24;--warn:#F2C46B;--warn-soft:#3A2F17;--good:var(--green);--good-soft:#173826;--info:#8DB8F2;--info-soft:#1F2D4D;
  --bar-a:var(--blue);--bar-b:var(--silver);--c-azul:#4388E8;--c-ambar:#BF8A14;--c-rosa:#E0609A;--c-verde:#3BAA57;--c-coral:#E5654F;--c-ardosia:#8A94A8;--on-chip:#0B1126;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.logo{width:168px;height:auto;stroke:none;color:var(--ink)}
button,input,select,textarea{font-family:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.shell{max-width:1240px;margin:0 auto;display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;padding-block:16px calc(92px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px;max-width:600px;margin:0 auto;width:100%}
.top{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;background:var(--action-soft);color:var(--action)}
.avatar.sm{width:38px;height:38px;font-size:13px}.avatar.lg{width:56px;height:56px;font-size:19px}
.hello{flex:1;min-width:0}.hello small{color:var(--ink2);font-size:13px;display:block}.hello b{font-size:15px;font-weight:600}
.iconbtn{width:44px;height:44px;border-radius:var(--rs);border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;position:relative;transition:background .15s}
.iconbtn:hover{background:var(--soft)}
.dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--late);border:2px solid var(--card)}
h1{font-family:var(--font-h);font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--font-h)}
.sub{color:var(--ink2);margin:6px 0 0;font-size:15px}
.pills{display:flex;gap:8px;overflow-x:auto;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:var(--rs);padding:0 14px;min-height:40px;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s,border-color .15s}
.pill:hover{color:var(--ink)}
.pill i{font-style:normal;color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill[aria-pressed="true"] i{color:inherit;opacity:.75}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}

.hero p{margin:0 0 6px;color:var(--hero-ink2);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.hero .row{display:flex;gap:8px;flex-wrap:wrap}
.chipline{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(204,213,230,.28);color:var(--hero-ink2);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:500}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 0 -8px}
.sec h2{font-family:var(--font);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);margin:0}.sec span{color:var(--ink2);font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;min-width:0}
.person{display:flex;align-items:center;gap:12px;min-width:0;background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer;width:100%}
.person .nm{flex:1;min-width:0}.person b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person small{color:var(--ink2);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.tag svg{width:14px;height:14px}
.t-late{background:var(--late-soft);color:var(--late)}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-good{background:var(--good-soft);color:var(--good)}.t-info{background:var(--info-soft);color:var(--info)}.t-neutral{background:var(--soft);color:var(--ink2)}.t-acc{background:var(--action-soft);color:var(--action)}
.quote{background:var(--soft);border-radius:var(--rs);padding:12px 14px;font-size:15px;margin:0}
.quote em{display:block;font-style:normal;font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:2px}
.acts{display:flex;gap:8px;align-items:center}
.btn{border:1px solid transparent;border-radius:var(--rs);min-height:46px;padding:0 16px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s,transform .1s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.dark,.btn.acc{background:var(--action);color:var(--on-action);flex:1}
.btn.dark:hover,.btn.acc:hover{filter:brightness(1.08)}
.btn.soft{background:var(--card);color:var(--ink);border-color:var(--line);flex:1}
.btn.soft:hover{background:var(--soft)}
.btn.round{width:46px;padding:0;flex:none;background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.round:hover{background:var(--soft)}
.acts .btn{min-width:0}.search{min-width:0}
.btn.sm{min-height:40px;font-size:14px;padding:0 12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.agenda{display:flex;flex-direction:column}
.slot{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.slot:last-child{border-bottom:0}
.time{color:var(--ink);font-family:var(--font-h);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;min-width:52px}
.slot .nm{flex:1;min-width:0}.slot b{display:block;font-size:15px;font-weight:600}.slot small{color:var(--ink2);font-size:13px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:0 14px;min-height:46px;color:var(--ink2)}
.search:focus-within{border-color:var(--action)}
.search input{flex:1;border:0;background:none;color:var(--ink);font:16px var(--font);min-width:0;outline:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:var(--rs);padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;min-height:40px;font-weight:600;font-size:14px;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(11,17,38,.08)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--soft);border-radius:var(--rs);padding:12px 14px;min-width:0}
.tile span{display:block;color:var(--ink2);font-size:12px;font-weight:600}.tile b{font-size:16px;font-weight:600}
.tri .tile b{font-family:var(--font-h);font-size:22px;font-weight:700}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--action);border-radius:99px}
.conv{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;background:none;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;color:inherit;transition:background .15s}
.conv:hover{background:var(--soft)}
.conv:last-child{border-bottom:0}
.conv .nm{flex:1;min-width:0}.conv b{font-size:15px;font-weight:600}.conv p{margin:2px 0 0;color:var(--ink2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv time{font-size:12px;color:var(--ink2);white-space:nowrap}
.list{padding:0;gap:0;overflow:hidden}
nav.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,auto);justify-content:space-around;gap:0;padding:6px max(2px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.dk{border:0;background:none;color:var(--ink2);border-radius:var(--rs);min-height:54px;min-width:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;cursor:pointer;font-weight:600;font-size:10.5px;letter-spacing:-.015em;position:relative;min-width:0}
.dk svg{width:44px;height:28px;padding:4px 12px;border-radius:999px;transition:background .15s}
.dk span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk[aria-current="page"]{color:var(--action)}
.dk[aria-current="page"] svg{background:var(--action-soft)}
.dk .cnt{position:absolute;top:2px;left:calc(50% + 6px);background:var(--late);color:#fff;font-size:10px;font-weight:700;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--card)}
.scrim{position:fixed;inset:0;background:rgba(11,17,38,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding-block:10px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.lbl{font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 8px;display:block}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:var(--rs);padding:0 14px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer;transition:background .15s}
.choice:hover{background:var(--soft)}
.choice[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tl{display:flex;flex-direction:column;gap:14px;border-left:2px solid var(--line);margin-left:6px;padding-left:16px;font-size:15px}
.tl em{display:block;font-style:normal;color:var(--ink2);font-size:12px;font-weight:600}
.chat{display:flex;flex-direction:column;gap:8px;background:var(--soft);border-radius:var(--r);padding:14px}
.msg{max-width:85%;padding:9px 13px;border-radius:12px;font-size:15px}
.msg.p{background:var(--card);align-self:flex-start;border-bottom-left-radius:4px;border:1px solid var(--line)}
.msg.a{background:var(--action);color:var(--on-action);align-self:flex-end;border-bottom-right-radius:4px}
.msg.e{background:var(--ink);color:var(--bg);align-self:flex-end;border-bottom-right-radius:4px}
.msg small{display:block;font-size:11px;opacity:.75;font-weight:600;margin-bottom:2px}
textarea,.inp{width:100%;border:1px solid var(--line);border-radius:var(--rs);background:var(--card);color:var(--ink);font:16px var(--font);padding:11px 13px;min-height:46px}
textarea:focus,.inp:focus{outline:none;border-color:var(--action);box-shadow:0 0 0 3px var(--action-soft)}
textarea{min-height:110px;resize:vertical}
.err{color:var(--late);font-size:13px;font-weight:600}
.check{display:flex;align-items:center;gap:12px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--action);flex:none}
.kpi{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{color:var(--ink2);font-size:13px;font-weight:500}.kpi b{font-family:var(--font-h);font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.kpi small{font-size:12px;color:var(--ink2)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.how{border:0;background:none;color:var(--action);font-weight:600;font-size:13px;padding:0;cursor:pointer;text-align:left;min-height:40px}

.bars{display:flex;align-items:flex-end;gap:4px;height:120px}
.bars i{flex:1;border-radius:3px 3px 0 0;background:var(--bar-a);min-height:4px}
.bars i.off{background:var(--bar-b)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);font-weight:500;flex-wrap:wrap}.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.cmp{display:flex;align-items:center;gap:14px}.cmp div{flex:1}
.cmp div div{font-family:var(--font-h)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:var(--rs);padding:6px 6px 6px 16px;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;width:min(calc(100% - 32px),480px);z-index:40;font-size:14px;box-shadow:0 8px 24px rgba(11,17,38,.2)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;min-height:44px;padding:0 12px;cursor:pointer}
.note{color:var(--ink2);font-size:14px;margin:0}
.empty{text-align:center;padding:26px 10px}.empty b{display:block;font-size:17px;font-family:var(--font-h)}.empty p{color:var(--ink2);margin:4px 0 0}
.cards{display:flex;flex-direction:column;gap:12px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.agi{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}.agi:last-child{border-bottom:0}

.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step{font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px;background:var(--soft);color:var(--ink2);display:inline-flex;align-items:center;gap:4px}

.money{font-family:var(--font-h);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.doc{background:#fff;color:#0B1126;border-radius:var(--rs);padding:20px;border:1px solid #DEE4EE;display:flex;flex-direction:column;gap:10px;font-size:14px}
.doc b{font-family:var(--font-h)}

.rec{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}.rec:last-child{border-bottom:0}

  .shell{gap:28px;padding:24px}
  .side{display:flex;flex-direction:column;gap:4px;width:232px;flex:none;position:sticky;top:24px;height:calc(100vh - 48px);padding:6px 0}
  .brand{padding:4px 12px 26px}
  .sd{border:0;background:none;color:var(--ink2);border-radius:var(--rs);min-height:44px;display:flex;align-items:center;gap:12px;padding:0 12px;font-weight:600;font-size:15px;cursor:pointer;position:relative;transition:background .15s,color .15s}
  .sd:hover{background:var(--soft);color:var(--ink)}

function aniver(n){if(!n)return null;const [d,m,a]=n.split("/").map(Number);let prox=new Date(HOJE.getFullYear(),m-1,d);if(prox<HOJE)prox=new Date(HOJE.getFullYear()+1,m-1,d);const dias=Math.round((prox-HOJE)/864e5);let idade=HOJE.getFullYear()-a;if(new Date(HOJE.getFullYear(),m-1,d)>HOJE)idade--;return {dias,idade}}

function header(t,sub){const h=new Date().getHours();const sau=h<12?"Bom dia":h<18?"Boa tarde":"Boa noite";

/* CONVERSAS: o que foi encaminhado para a equipe, depois a caixa de entrada */
function conversas(){
 const all=S.pend;
 const maisAntiga=all.reduce((m,x)=>Math.max(m,x.espera),0);
 const fl={todas:()=>true,fora:c=>c.fora,assumidas:c=>S.assumidas[c.pid]};
 const cv=S.conv.filter(fl[fConv]);
 const ord=all.slice().sort((a,b)=>(a.tag==="t-late"?0:1)-(b.tag==="t-late"?0:1)||b.espera-a.espera);
 return header("Conversas","A IA responde sozinha. Em cima fica só o que foi encaminhado para a equipe.")+
 `<div class="grid2"><div class="stack">
 <section class="hero" aria-label="Encaminhadas para a equipe">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><p>Precisa de você</p><div class="big">${all.length}</div></div>${all.length?`<span class="chipline">${IC.clock} a mais antiga há ${maisAntiga} min</span>`:""}</div>
 </section>
 <div class="stack">${ord.map(cardPend).join("")||`<div class="card empty"><b>Tudo em dia</b><p>Quando algo for encaminhado para a equipe, aparece aqui e no grupo de WhatsApp da clínica.</p></div>`}</div>
 </div><div class="stack">
 <div class="sec"><h2>Todas as conversas</h2><span>hoje</span></div>
 <div class="pills" role="group" aria-label="Filtrar conversas">${[["todas","Todas"],["fora","Fora do horário"],["assumidas","A equipe assumiu"]].map(f=>`<button class="pill" data-fc="${f[0]}" aria-pressed="${fConv===f[0]}">${f[1]} <i>${S.conv.filter(fl[f[0]]).length}</i></button>`).join("")}</div>
 <div class="card list">${cv.map(c=>{const p=P(c.pid);const st=S.assumidas[c.pid]?["A equipe assumiu","t-neutral"]:[c.st,c.tag];return `<button class="conv" data-chat="${p.id}">${av(p,"sm")}<span class="nm"><span style="display:flex;justify-content:space-between;gap:8px"><b>${esc(p.nome)}</b><time>${c.h}</time></span><p>${esc(c.ult)}</p><span class="tag ${st[1]}" style="margin-top:6px">${st[0]}</span>${c.fora?' <span class="tag t-neutral" style="margin-top:6px">Fora do horário</span>':""}</span></button>`}).join("")||`<div class="empty"><b>Nenhuma conversa aqui</b><p>Troque o filtro para ver as outras.</p></div>`}</div>
 </div></div>`+foot();
}
function cardPend(x){const p=P(x.pid);const late=x.espera>15;
 return `<article class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><span class="tag ${x.tag}">${x.tipo}</span><span class="tag ${late?"t-late":"t-neutral"}">${IC.clock} ${x.espera} min</span></div>
 <button class="person" data-open="${p.id}">${av(p,"sm")}<span class="nm"><b>${esc(p.nome)}</b><small>${p.ja?"Já é paciente":"Novo contato"} · ${esc(p.sit)}</small></span></button>
 <p class="quote"><em>Mensagem do paciente</em>${esc(x.msg)}</p>
 ${x.opcoes?`<div><p class="lbl">Qual resposta a IA deve dar?</p><div class="wrap">${x.opcoes.map(o=>`<button class="choice" data-dec="${x.id}" data-op="${esc(o)}">${esc(o)}</button>`).join("")}<button class="choice" data-act="outra" data-id="${x.id}">${IC.edit} Outra resposta</button></div></div>`:
 x.ensinar?`<div class="acts"><button class="btn acc" data-act="ensinar" data-id="${x.id}">Responder e ensinar a IA</button><button class="btn round" data-act="ligar" aria-label="Ligar">${IC.tel}</button></div>`:
 `<div class="acts"><button class="btn green" data-act="assumir" data-pid="${p.id}" data-id="${x.id}">${IC.wa}Abrir conversa</button><button class="btn round" data-act="ligar" aria-label="Ligar para ${esc(p.nome)}">${IC.tel}</button><button class="btn round" data-act="resolvido" data-id="${x.id}" aria-label="Marcar como resolvido">${IC.ok}</button></div>`}
 </article>`}

/* AGENDA DO DIA */
function agenda(){
 const ag=S.agenda.filter(a=>a.dia===dia);const hoje=dia==="Hoje";
 const conf=ag.filter(a=>a.conf==="Confirmou"||a.conf==="Remarcou pela IA").length,sem=ag.filter(a=>a.conf==="Sem resposta"||a.conf==="Aguardando confirmação").length;
 const marc=S.agenda.filter(a=>a.dia==="Hoje"&&a.pres).length,tot=S.agenda.filter(a=>a.dia==="Hoje").length;
 const mes={marcadas:41,vieram:37,faltas:4};
 return header("Agenda do dia",hoje?"Marque quem veio e quem faltou.":"A IA pede a confirmação de quem falta hoje, às 17h.")+
 `<div class="seg" style="grid-template-columns:1fr 1fr" role="group" aria-label="Dia">${["Hoje","Amanhã"].map(d=>`<button data-dia="${d}" aria-pressed="${dia===d}">${d}</button>`).join("")}</div>
 <div class="grid2"><div class="stack">
 <div class="tri"><div class="tile"><span>Consultas</span><b>${ag.length}</b></div><div class="tile"><span>Confirmadas</span><b>${conf}</b></div><div class="tile"><span>Sem resposta</span><b>${sem}</b></div></div>
 <div class="card"><div class="agenda">${ag.map(slotAg).join("")}</div></div>
 </div><div class="stack">
 ${hoje?`<div class="card"><b>Presença de hoje</b><div class="bar"><i style="width:${Math.round(marc/tot*100)}%"></i></div><small class="note">${marc} de ${tot} consultas marcadas como compareceu ou faltou.</small></div>`:""}
 <div class="card"><div class="cardh"><b>Comparecimento em novembro</b></div>
  <div class="tri"><div class="tile"><span>Marcadas</span><b>${mes.marcadas}</b></div><div class="tile"><span>Vieram</span><b>${Math.round(mes.vieram/mes.marcadas*100)}%</b></div><div class="tile"><span>Faltaram</span><b>${Math.round(mes.faltas/mes.marcadas*100)}%</b></div></div>
  <small class="note">${mes.vieram} pacientes vieram e ${mes.faltas} faltaram. Conta só as consultas marcadas como compareceu ou faltou.</small></div>
 <div class="card"><b>O que a IA fez na agenda hoje</b><p class="note">2 avaliações marcadas, 1 remarcação e 5 confirmações recebidas. Lembrete 2 horas antes de cada consulta.</p></div>
 </div></div>`+foot();
}
function slotAg(a){const p=P(a.pid);const hoje=a.dia==="Hoje";
 let acts="";
 if(hoje){
  if(!a.pres)acts=`<div class="acts"><button class="btn soft sm" style="flex:1" data-pres="${a.id}" data-v3="Compareceu">${IC.ok}Compareceu</button><button class="btn soft sm" style="flex:1" data-pres="${a.id}" data-v3="Faltou">${IC.x}Faltou</button></div>`;
  else if(a.pres==="Compareceu")acts=`<div class="acts"><span class="tag t-good">${IC.ok} Compareceu</span><button class="how" data-pres="${a.id}" data-v3="">Corrigir</button></div>`;
  else acts=`<div class="acts" style="flex-wrap:wrap"><span class="tag t-late">Faltou</span>${a.remarcar===true?`<span class="tag t-info">IA oferecendo novo horário</span>`:a.remarcar===false?`<span class="tag t-neutral">Sem remarcação</span>`:""}<button class="how" data-pres="${a.id}" data-v3="">Corrigir</button></div>${a.remarcar==null?`<div class="acts" style="flex-wrap:wrap"><span style="flex:1 1 190px;font-size:14px;font-weight:600">Pedir à IA para oferecer novo horário?</span><button class="btn dark sm" style="flex:none;min-width:72px" data-act="remarcar" data-id="${a.id}" data-v2="1">Sim</button><button class="btn soft sm" style="flex:none;min-width:72px" data-act="remarcar" data-id="${a.id}" data-v2="0">Não</button></div>`:""}`;
 }
 return `<div class="agi"><div class="slot"><span class="time">${a.h}</span><button class="person" data-open="${p.id}" style="flex:1"><span class="nm"><b>${esc(p.nome)}</b><small>${esc(a.tipo)}</small></span></button><span class="tag ${CONFTAG[a.conf]}">${a.conf}</span></div>${acts}</div>`}

/* PACIENTES: CRM */

 `<div class="acts"><label class="search" style="flex:1">${IC.search}<input id="busca" type="search" placeholder="Nome, telefone ou e-mail" value="${esc(busca)}" aria-label="Buscar paciente"></label><button class="btn round" style="background:var(--action);color:var(--on-action);border-color:var(--action)" data-act="novo" aria-label="Cadastrar paciente">${IC.plus}</button></div>
 <div class="seg" role="group" aria-label="Tipo">${[["todos","Todos"],["novos","Novos contatos"],["ja","Já pacientes"]].map(s=>`<button data-fpac="${s[0]}" aria-pressed="${fPac===s[0]}">${s[1]}</button>`).join("")}</div>

 ${emT.length&&!busca&&!fSit&&fPac==="todos"?`<div class="card"><div class="cardh"><b>Em tratamento agora</b><span class="tag t-good">${emT.length}</span></div>${emT.map(p=>`<button class="person" data-open="${p.id}">${av(p,"sm")}<span class="nm"><b>${esc(p.nome)}</b><small>${esc(p.trat.nome)}${p.prox?" · próxima "+esc(p.prox.toLowerCase()):""}</small><span class="bar" style="margin-top:6px;display:block"><i style="width:${p.trat.total?Math.round(p.trat.feitas/p.trat.total*100):0}%"></i></span></span><small class="note" style="white-space:nowrap">${p.trat.feitas} de ${p.trat.total}</small></button>`).join("")}</div>`:""}

 <div class="card list">${lst.map(p=>{const a=aniver(p.nasc);return `<button class="conv" data-open="${p.id}">${av(p,"sm")}<span class="nm"><span style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${esc(p.nome)}</b>${IC.next}</span><p>${esc(p.tel)} · ${esc(p.origem)}</p><span style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><span class="tag ${SITTAG[p.sit]}">${p.sit}</span>${a&&a.dias<=7?`<span class="bday">${IC.gift} ${a.dias===0?"Aniversário hoje":`Aniversário em ${a.dias} dias`}</span>`:""}</span>${p.trat&&p.trat.total>1?`<span style="display:flex;align-items:center;gap:8px;margin-top:8px"><span class="bar" style="flex:1"><i style="width:${Math.round(p.trat.feitas/p.trat.total*100)}%"></i></span><small class="note" style="font-size:12px">${p.trat.feitas} de ${p.trat.total} sessões</small></span>`:""}</span></button>`}).join("")||`<div class="empty"><b>Ninguém encontrado</b><p>Confira a grafia ou cadastre pelo botão +.</p></div>`}</div>`+foot();
}
function ficha(id){const p=P(id);if(!p)return;const t=p.trat;const a=aniver(p.nasc);const o=S.orc.find(x=>x.pid===p.id);
 const linha=(k,v)=>`<div><dt>${k}</dt><dd>${v||'<span class="note" style="font-size:14px">Não informado</span>'}</dd></div>`;

 ${p.motivo?`<div class="tile"><span>Motivo de não ter fechado</span><b>${esc(p.motivo)}</b></div>`:""}
 <div><p class="lbl">Anotações da equipe</p><textarea id="nota" placeholder="Preferências, como gosta de ser chamado, o que falta para decidir">${esc(p.notas)}</textarea><p class="note" style="font-size:12px;margin-top:6px">Anotação clínica fica no prontuário do sistema da clínica, não aqui.</p><button class="btn soft" style="margin-top:8px;width:100%" data-act="salvanota" data-pid="${p.id}">Salvar anotação</button></div>

 <button class="btn soft" data-close>Fechar</button>`);

function lembretes(o){

 return `<div><p class="lbl" style="margin-bottom:6px">Lembretes da IA</p><div class="steps">${LEMB.map(d=>`<span class="step ${d<=o.dias?"ok":d===nx?"nx":""}">${d<=o.dias?IC.ok:""}Dia ${d}</span>`).join("")}</div><small class="note" style="display:block;margin-top:6px">${nx?`Próximo em ${nx-o.dias} ${nx-o.dias===1?"dia":"dias"}`:"Lembretes encerrados. Vale uma ligação da equipe."}</small></div>`}

 const by=st=>S.orc.filter(o=>o.st===st);
 const ab=by("aberto"),somaAb=ab.reduce((s,o)=>s+o.valor,0),somaAc=by("aceito").reduce((s,o)=>s+o.valor,0);

 <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div class="pills" role="group" aria-label="Situação do orçamento" style="margin:0;padding:2px 0">${[["aberto","Em aberto"],["aceito","Aceitos"],["recusado","Recusados"]].map(f=>`<button class="pill" data-fo="${f[0]}" aria-pressed="${fOrc===f[0]}">${f[1]} <i>${by(f[0]).length}</i></button>`).join("")}</div><button class="btn soft sm" style="flex:none" data-act="textos">${IC.text}Textos padrão</button></div>
 <div class="cards">${lst.map(cardOrc).join("")||`<div class="card empty"><b>Nenhum orçamento aqui</b><p>Troque o filtro ou crie um orçamento novo.</p></div>`}</div>`+foot();

 return `<article class="card"><div style="display:flex;gap:12px;align-items:center"><button class="person" data-open="${p.id}" style="flex:1">${av(p,"sm")}<span class="nm"><b>${esc(p.nome)}</b><small>Nº ${o.num} · ${quando}</small></span></button><span class="money">${brl(o.valor)}</span></div>
 <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap"><b style="font-weight:600">${esc(nomeOrc(o))}</b>${o.st==="aceito"?`<span class="wrap"><span class="tag t-good">Aceito</span>${o.rec?'<span class="tag t-acc">Recuperado pela assistente</span>':""}</span>`:o.st==="recusado"?`<span class="tag t-late">Recusou: ${esc(o.motivo)}</span>`:""}</div>

 </article>`}
function pdf(o,novo){const p=P(o.pid);const T=TPL[o.tpl];const emi=new Date(HOJE-o.dias*864e5);const venc=new Date(+emi+o.val*864e5);
 const unit=T.unid==="dente"&&o.qtd>1?o.valor/o.qtd:o.valor;
 sheet(`<h2>${novo?"Conferir antes de enviar":"Orçamento nº "+o.num}</h2>

document.addEventListener("click",e=>{
 const t=e.target.closest("[data-v],[data-go],[data-open],[data-chat],[data-fc],[data-fo],[data-fpac],[data-fsit],[data-etapa],[data-dn],[data-dia],[data-per],[data-dec],[data-sel],[data-setsit],[data-motivo],[data-pres],[data-rec],[data-act]");if(!t)return;const d=t.dataset;
 if(d.v)return go(d.v);if(d.go)return go(d.go);
 if(d.open)return ficha(+d.open);if(d.chat)return chat(+d.chat);
 if(d.etapa!==undefined&&t.matches("[data-etapa]")){etapa=+d.etapa;dsel.origem=null;const y=scrollY;render();scrollTo(0,y);return}
 if(d.dn){const i=+d.i;dsel[d.dn]=dsel[d.dn]===i?null:i;hideTip();document.getElementById("dn-"+d.dn).outerHTML=DN[d.dn]();return}
 if(d.fc){fConv=d.fc;return render()}if(d.fo){fOrc=d.fo;return render()}if(d.fpac){fPac=d.fpac;return render()}if(d.fsit!==undefined&&t.matches("[data-fsit]")){fSit=d.fsit;return render()}
 if(d.dia){dia=d.dia;return render()}if(d.per){periodo=d.per;render();return toast("No app real, os números mudam para o período escolhido")}
 if(d.dec){const x=S.pend.find(y=>y.id===+d.dec);return resolvePend(x.id,"A IA vai responder: "+d.op.toLowerCase(),"Equipe decidiu: "+d.op)}
 if(d.sel){S.ret.find(r=>r.id===+d.sel).sel=t.checked;return render()}
 if(d.pres){const a=S.agenda.find(y=>y.id===+d.pres),p=P(a.pid),u=snap();a.pres=d.v3||null;if(!a.pres){delete a.remarcar;render();return toast("Marcação removida",u)}
  p.hist.unshift(["Agora",a.pres+" à consulta das "+a.h]);
  if(a.pres==="Compareceu"&&a.tipo==="Avaliação"&&p.sit==="Avaliação marcada"){p.sit="Avaliou, aguardando orçamento";render();return toast(first(p.nome)+" compareceu. Próximo passo: o orçamento",u)}
  render();return toast(first(p.nome)+": "+a.pres.toLowerCase(),u)}
 if(d.rec){const r=S.recs.find(y=>y.id===+d.rec);r.st=d.v3;render();return conferir()}
 if(d.setsit){const p=P(+d.pid);if(d.setsit==="Não fechou")return motivoNao(p.id);const u=snap();p.sit=d.setsit;if(["Em tratamento","Tratamento concluído"].includes(p.sit))p.ja=true;p.hist.unshift(["Agora","Situação: "+p.sit]);closeSheets();render();return toast(first(p.nome)+": "+p.sit,u)}
 if(d.motivo){const p=P(+d.pid);const u=snap();p.sit="Não fechou";p.motivo=d.motivo;p.hist.unshift(["Agora","Não fechou: "+d.motivo]);if(d.oid){const o=S.orc.find(y=>y.id===+d.oid);o.st="recusado";o.motivo=d.motivo}closeSheets();render();return toast(first(p.nome)+" marcado como não fechou",u)}
 const pid=+d.pid,id=+d.id;
 switch(d.act){
  case "avisos":return avisos();
  case "assumir":{S.assumidas[pid]=true;S.pend=S.pend.filter(y=>y.id!==id);render();chat(pid);return toast("Você assumiu a conversa. A IA pausou para "+first(P(pid).nome))}
  case "assumirChat":S.assumidas[pid]=true;S.pend=S.pend.filter(y=>y.pid!==pid);render();return chat(pid);
  case "devolver":delete S.assumidas[pid];closeSheets();render();return toast("Conversa devolvida para a IA");
  case "enviarEq":{const v=$("#resp").value.trim();if(!v){$("#resp").focus();return toast("Escreva a mensagem antes de enviar")}P(pid).hist.unshift(["Agora","Equipe: "+v]);closeSheets();render();return toast("Mensagem enviada para "+first(P(pid).nome))}
  case "resolvido":return resolvePend(id,"Resolvido","Resolvido pela equipe");
  case "outra":{const x=S.pend.find(y=>y.id===id);return sheet(`<h2>Outra resposta</h2><p class="quote"><em>Mensagem de ${esc(first(P(x.pid).nome))}</em>${esc(x.msg)}</p><label class="lbl" for="outr">O que a IA deve responder</label><textarea id="outr" placeholder="Ex.: Para as 10 lentes no Pix, a Dra. Suzana consegue 7% de desconto. Quer que eu reserve o primeiro horário?"></textarea><span class="err" id="outerr" aria-live="polite"></span><div class="acts"><button class="btn dark" data-act="outraOk" data-id="${id}">Enviar resposta</button><button class="btn soft" data-close>Cancelar</button></div>`)}
  case "outraOk":{const v=$("#outr").value.trim();if(!v){$("#outerr").textContent="Escreva a resposta antes de enviar.";return}return resolvePend(id,"Resposta enviada","Equipe respondeu: "+v)}
  case "ensinar":{const x=S.pend.find(y=>y.id===id);return sheet(`<h2>Responder e ensinar a IA</h2><p class="quote"><em>Pergunta</em>${esc(x.msg)}</p><label class="lbl" for="ens">Resposta</label><textarea id="ens" placeholder="Ex.: Não atendemos pelo OdontoPrev, mas dá para parcelar em até 12 vezes sem juros no cartão."></textarea><span class="err" id="enserr" aria-live="polite"></span><label class="check"><input type="checkbox" id="base" checked> Guardar na base da clínica para as próximas vezes</label><div class="acts"><button class="btn dark" data-act="ensinarOk" data-id="${id}">Enviar</button><button class="btn soft" data-close>Cancelar</button></div>`)}
  case "ensinarOk":{const v=$("#ens").value.trim();if(!v){$("#enserr").textContent="Escreva a resposta antes de enviar.";return}const b=$("#base").checked;return resolvePend(id,b?"Enviado. A IA aprendeu essa resposta":"Resposta enviada","Equipe respondeu"+(b?" e a resposta entrou na base da clínica":""))}
  case "remarcar":{const a=S.agenda.find(y=>y.id===id),u=snap(),sim=d.v2==="1";a.remarcar=sim;P(a.pid).hist.unshift(["Agora",sim?"IA ofereceu novos horários depois da falta":"Faltou. A equipe decidiu não remarcar agora"]);render();return toast(sim?"A IA vai oferecer novos horários para "+first(P(a.pid).nome):"Ok, sem remarcação para "+first(P(a.pid).nome),u)}
  case "sit":return mudarSit(pid);
  case "edtrat":return edTrat(pid);
  case "eddados":return formDados(P(pid));
  case "novo":return formDados();
  case "salvadados":{const n=$("#fn").value.trim(),tel=$("#ft").value.replace(/\D/g,""),nasc=$("#fb").value.trim(),em=$("#fe").value.trim();const er=$("#ferr");
   if(n.length<2){er.textContent="Digite o nome do paciente.";return}if(tel.length<10){er.textContent="Digite o WhatsApp com DDD.";return}if(nasc&&!/^\d{2}\/\d{2}\/\d{4}$/.test(nasc)){er.textContent="Escreva o aniversário como dd/mm/aaaa.";return}if(em&&!/^\S+@\S+\.\S+$/.test(em)){er.textContent="Confira o e-mail.";return}
   const dados={nome:n,tel:$("#ft").value.trim(),nasc,email:em,end:$("#fa").value.trim(),origem:$("#fo").value,indic:$("#fi").value.trim()};const u=snap();
   if(pid){Object.assign(P(pid),dados);P(pid).hist.unshift(["Agora","Dados atualizados"]);closeSheets();render();ficha(pid);return toast("Dados salvos",u)}
   const ja=document.querySelector('[data-act="ja"][aria-pressed="true"]').dataset.v2==="1";S.pac.unshift({id:Date.now()%100000,...dados,sit:ja?"Tratamento concluído":"Novo contato",ja,inicio:"11/2026",ult:"",prox:"",trat:null,notas:"",hist:[["Agora","Cadastrado pela recepção"]]});closeSheets();render();return toast("Cadastro feito: "+first(n),u)}
  case "ja":case "val":t.parentNode.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t));return;
  case "salvatrat":{const v=parseInt(($("#tv").value||"").replace(/\D/g,""),10)||0,f=parseInt($("#tf").value,10)||0,tot=parseInt($("#tt").value,10)||0;if(!$("#tn").value.trim()){$("#terr").textContent="Escreva o tratamento.";return}if(f>tot&&tot){$("#terr").textContent="Sessões feitas não pode ser maior que o total.";return}const p=P(pid),u=snap();p.trat={nome:$("#tn").value.trim(),valor:v,pag:$("#tp").value.trim(),feitas:f,total:tot};p.hist.unshift(["Agora","Tratamento atualizado"]);closeSheets();render();ficha(pid);return toast("Tratamento salvo",u)}
  case "salvanota":{const p=P(pid);p.notas=$("#nota").value;return toast("Anotação salva")}
  case "novoOrc":return novoOrc();
  case "textos":return textos();
  case "tpl":return textos(d.v2);
  case "salvatpl":{const k=d.v2,lin=s=>s.split("\n").map(x=>x.trim()).filter(Boolean);TPL[k]={...TPL[k],como:$("#xc").value.trim(),etapas:lin($("#xe").value),prazo:$("#xp").value.trim(),inclui:lin($("#xi").value)};textos();return toast("Texto padrão salvo. Vale para os próximos orçamentos")}
  case "verOrc":{const r=lerOrc();rasc=r;const er=$("#oerr");if(!r.pid){er.textContent="Escolha o paciente.";return}if(!r.valor){er.textContent="Digite o valor total em reais.";return}if(r.valor<=AVAL){er.textContent="O valor precisa ser maior que o da avaliação.";return}return pdf({num:142,pid:+r.pid,tpl:r.tpl,qtd:r.qtd,valor:r.valor,pag:r.pag,val:r.val,dias:0},true)}
  case "enviarOrc":{const r=rasc,p=P(+r.pid),u=snap();const o={id:Date.now()%100000,num:142,pid:p.id,tpl:r.tpl,qtd:r.qtd,valor:r.valor,pag:r.pag||"A definir",dias:0,st:"aberto",val:r.val};S.orc.unshift(o);p.sit="Orçamento em aberto";p.trat={nome:nomeOrc(o),feitas:0,total:0,valor:r.valor,pag:o.pag};p.hist.unshift(["Agora","Orçamento nº 142 enviado pelo WhatsApp: "+brl(r.valor)]);rasc=null;fOrc="aberto";closeSheets();go("orcamentos");return toast("Orçamento enviado para "+first(p.nome)+". Lembretes nos dias 3, 10, 17 e 30",u)}
  case "pdf":return pdf(S.orc.find(o=>o.id===id));
  case "reenviar":closeSheets();return toast("Orçamento reenviado para "+first(P(pid).nome));
  case "aceitou":{const o=S.orc.find(y=>y.id===id),p=P(o.pid),u=snap();o.st="aceito";o.rec=o.dias>=7;p.sit="Em tratamento";p.ja=true;if(p.trat)p.trat.total=p.trat.total||3;p.hist.unshift(["Agora","Aceitou o orçamento: "+brl(o.valor)]);if(o.rec)S.recs.push({id:Date.now()%100000,nome:p.nome,trat:nomeOrc(o),valor:o.valor,como:`Parado há ${o.dias} dias sem contato da equipe. Respondeu à assistente e aceitou.`,st:"A confirmar"});render();return toast(o.rec?first(p.nome)+" aceitou. Entra como recuperado pela assistente no Painel":first(p.nome)+" aceitou o orçamento",u)}
  case "recusou":{const o=S.orc.find(y=>y.id===id);return motivoNao(o.pid,o.id)}
  case "conferir":return conferir();
  case "todos":{const all=S.ret.every(r=>r.sel);S.ret.forEach(r=>r.sel=!all);return render()}
  case "lote":return toast(S.ret.filter(r=>r.sel).length+" mensagens aprovadas. Saem ao longo do dia");
  case "how":return sheet(`<h2>Como calculamos</h2>
   <p><b>Recuperado pela assistente</b> (entra no total): paciente que estava parado há 7 dias ou mais, sem contato da equipe, respondeu à assistente e aceitou o tratamento em até 30 dias.</p>
   <p><b>Influenciado</b> (fora do total): a assistente ajudou, mas o paciente não estava parado. Exemplo: confirmou a avaliação e fechou na consulta.</p>
   <p><b>Orgânico</b> (não conta): fechou sem participação da assistente.</p>
   <p class="note">O valor vem do orçamento marcado como aceito. A clínica confere cada tratamento e pode contestar.</p>
   <button class="btn soft" data-close>Entendi</button>`);
  case "wa":return toast("No app real, abre a conversa no WhatsApp");
  case "ligar":return toast("No app real, abre a ligação");
 }
});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);const v=OLD[h]||h;if(V[v]&&v!==view){view=v;render()}});
render();
</script>
