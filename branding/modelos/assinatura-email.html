<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Assinatura de e-mail Keshion AI</title>
<!--
  COMO USAR NO GMAIL
  1. Abra este arquivo no navegador, selecione a assinatura (Ctrl+A) e copie (Ctrl+C).
  2. Gmail > Configurações > Ver todas as configurações > Assinatura > Criar nova > cole (Ctrl+V).
  3. Se a imagem não aparecer depois de colar, use o ícone de imagem do Gmail e envie logo-email-480.png (largura 160 px).
  PENDENTE: nome, cargo e telefone (a Erica vai passar). Enquanto isso, assinatura sem nome.
  Fontes de e-mail: Manrope e Inter não carregam na maioria dos programas de e-mail, por isso a assinatura usa Arial como reserva.
-->
</head>
<body style="margin:24px;background:#ffffff;">
<table cellpadding="0" cellspacing="0" border="0" style="font-family:Inter,Arial,Helvetica,sans-serif;color:#0B1126;font-size:14px;line-height:1.5;">
  <tr>
    <td style="padding:0 0 10px 0;">
      <img src="logo-email-480.png" width="160" alt="keshion AI" style="display:block;border:0;width:160px;height:auto;">
    </td>
  </tr>
  <tr>
    <td style="padding:0 0 8px 0;border-top:2px solid #4388E8;font-family:Inter,Arial,Helvetica,sans-serif;font-size:13px;color:#50596A;padding-top:8px;">
      Automações inteligentes
    </td>
  </tr>
  <tr>
    <td style="font-family:Inter,Arial,Helvetica,sans-serif;font-size:13px;color:#0B1126;">
      <a href="mailto:contato@keshion.com" style="color:#2459A6;text-decoration:none;">contato@keshion.com</a>
      &nbsp;·&nbsp;
      <a href="https://keshion.com" style="color:#2459A6;text-decoration:none;">keshion.com</a>
    </td>
  </tr>
</table>
</body>
</html>
